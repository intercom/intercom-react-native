version: 2.1

# Default VM config to be used for macOS builds
macos_config: &macos_config
  macos:
    xcode: 16.0.0
  resource_class: m4pro.medium
  shell: /bin/bash --login -eo pipefail

executors:
  default:
    docker:
      - image: cimg/node:22.14.0
    working_directory: ~/project

orbs:
  node: circleci/node@5.1.0

# Always run job
run_always: &run_always
  filters:
    tags:
      only: /.*/

commands:
  attach_project:
    steps:
      - attach_workspace:
          at: ~/project

jobs:
  install-dependencies:
    <<: *macos_config
    steps:
      - checkout
      - attach_project
      - node/install:
          node-version: 22.14.0

      - run:
          name: Verify Socket Firewall registry is active
          command: |
            REGISTRY=$(npm config get registry)
            echo "npm registry: $REGISTRY"
            echo "$REGISTRY" | grep -q socket-firewall-registry || { echo "FAIL: npm not routed through Socket Firewall"; exit 1; }

      - run:
          name: Install dependencies
          command: |
            corepack enable
            yarn install
      - save_cache:
          key: dependencies-{{ checksum "package.json" }}
          paths: node_modules
      - save_cache:
          key: dependencies-example-{{ checksum "example/package.json" }}
          paths: example/node_modules
      - persist_to_workspace:
          root: .
          paths: .

  lint:
    executor: default
    steps:
      - attach_project
      - run:
          name: Lint files
          command: |
            yarn lint

  typescript:
    executor: default
    steps:
      - attach_project
      - run:
          name: Typecheck files
          command: |
            yarn typescript

  unit-tests:
    executor: default
    steps:
      - attach_project
      - run:
          name: Run unit tests
          command: |
            yarn test --coverage
      - store_artifacts:
          path: coverage
          destination: coverage

  build-package:
    executor: default
    steps:
      - attach_project
      - run:
          name: Build package
          command: |
            yarn prepare

workflows:
  version: 2.1
  build-and-test:
    jobs:
      - install-dependencies:
          <<: *run_always
      - lint:
          <<: *run_always
          requires:
            - install-dependencies
      - typescript:
          <<: *run_always
          requires:
            - install-dependencies
      - unit-tests:
          <<: *run_always
          requires:
            - install-dependencies
      - build-package:
          <<: *run_always
          requires:
            - install-dependencies
